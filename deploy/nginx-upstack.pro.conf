# upstack.pro — reverse proxy to the Miniflare-hosted Worker on 127.0.0.1:8787.
#
# This is the pre-TLS template `enable-tls.sh` starts from. Once that script has
# run, the live copy at /etc/nginx/sites-available/upstack.pro carries Certbot's
# listen/ssl directives and the HTTP->HTTPS redirect. Do not copy this file over
# the live one afterwards; it would drop TLS.
#
# Deliberately not a `default_server`: this vhost answers only for its own
# server_name, so the dashboards already on this box keep their traffic.
server {
    listen 80;
    listen [::]:80;
    server_name upstack.pro www.upstack.pro;

    # Kept above the redirect so certificate renewal is never redirected away.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
